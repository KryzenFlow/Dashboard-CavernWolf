# Optional memory backends for Hermes Studio (WSL). Not Claw's brain.
# Claw Opus still uses OPENCLAW_GATEWAY_URL via Hermes.
#
#   docker compose up -d
#
# Set on WSL Hermes:
#   REDIS_URL=redis://default:${REDIS_PASSWORD}@127.0.0.1:6379
#   VECTOR_DB_URL=http://127.0.0.1:6333

services:
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    # Localhost only — for WSL Hermes memory connectors (not public ingress).
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - memory_net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    networks:
      - memory_net
    restart: unless-stopped

networks:
  memory_net:
    driver: bridge

volumes:
  redis_data:
  qdrant_data:
