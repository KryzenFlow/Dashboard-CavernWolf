<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Studio — CavernWolf Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="studio-dashboard">
    <header class="studio-header">
      <h1>⚙️ Hermes Studio</h1>
      <div class="header-status">
        <span id="connection-status" class="status">Connecting…</span>
        <span id="git-warning" class="git-warning hidden"></span>
      </div>
    </header>

    <nav class="studio-tabs" role="tablist">
      <button class="tab active" data-tab="chat" role="tab" aria-selected="true">💬 Chat</button>
      <button class="tab" data-tab="skills" role="tab">⚡ Skills IDE</button>
      <button class="tab" data-tab="memory" role="tab">🧠 Memory</button>
      <button class="tab" data-tab="git" role="tab">📚 Git</button>
    </nav>

    <div class="studio-content">
      <aside class="studio-left">
        <section id="panel-chat" class="panel active">
          <div id="chat-transcript" class="chat-transcript" aria-live="polite"></div>
          <form id="chat-form" class="chat-form">
            <textarea id="chat-input" rows="2" placeholder="Message Claw Opus…" aria-label="Chat message"></textarea>
            <button type="submit" class="btn-primary">Send</button>
          </form>
        </section>

        <section id="panel-memory" class="panel hidden">
          <h2>Memory</h2>
          <ul id="memory-list" class="file-list"></ul>
        </section>

        <section id="panel-git" class="panel hidden">
          <h2>Git Status</h2>
          <pre id="git-status" class="git-status">Loading…</pre>
          <div class="git-actions">
            <p class="status">Commit and push are supervisor-only. This UI is read-only for git.</p>
          </div>
        </section>
      </aside>

      <main id="panel-skills" class="studio-right hidden">
        <div class="skills-browser">
          <h3>Skills</h3>
          <ul id="skills-list" class="file-list"></ul>
          <button id="btn-new-skill" class="btn-new-skill">+ New Skill</button>
        </div>
        <div id="skill-editor" class="skill-editor hidden">
          <div class="editor-header">
            <h3 id="editor-filename">skill.py</h3>
            <div class="editor-actions">
              <button id="btn-save-skill" class="btn-action">💾 Save</button>
              <button id="btn-test-skill" class="btn-action">✅ Test</button>
              <button id="btn-improve-skill" class="btn-action">Ask Claw</button>
            </div>
          </div>
          <textarea id="code-editor" class="code-editor" spellcheck="false" aria-label="Skill code editor"></textarea>
          <div id="test-results" class="test-results hidden"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
